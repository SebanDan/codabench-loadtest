# Mini-MNIST Challenge Bundle
# Created by: Ihsan Ullah
# Created on: Apr 05, 2026

version: 2
title: Mini-MNIST Digit Classification
description: A mini-MNIST challenge with 20 training images per class and 5 test images per class.
image: logo.png
registration_auto_approve: True
docker_image: ghcr.io/neuromechanist/codalab-eeg2025:v15

terms: pages/terms.md
pages:  
  - title: Overview
    file: pages/overview.md
  - title: Evaluation
    file: pages/evaluation.md

phases:
  - index: 0
    name: Competition Phase
    description: Train on 20 images/class and predict on 5 images/class.
    start: 2026-01-01
    end: 2027-01-01
    execution_time_limit: 60
    max_submissions_per_day: 2147483647
    max_submissions_per_person: 2147483647
    tasks:
      - 0

tasks:
  - index: 0
    name: MNIST Classification Task
    description: Classify 50 handwritten digits (5 per class).
    scoring_program: scoring_program/
    ingestion_program: ingestion_program/

leaderboards:
  - title: Results
    key: main
    hidden: false
    columns:
      - title: overall score
        key: overall
        index: 0
        sorting: desc
      - title: challenge 1
        key: challenge1
        index: 1
        sorting: desc
        hidden: false
      - title: challenge 2
        key: challenge2
        index: 2
        sorting: desc
        hidden: false